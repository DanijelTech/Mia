name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build offline package
        run: ./build-package.sh
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Mia $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz \
              --title "Mia $GITHUB_REF_NAME" \
              --generate-notes
          fi
