# Copy to server.yaml and edit. Secrets live in ~/.hermes/.env (NOT here).
#
# This example is tuned for a fully offline, Slovenian-first stack:
#   STT: faster-whisper large-v3-turbo (local, GPU or CPU)
#   LLM: local model behind Hermes Agent (e.g. Qwen3-30B-A3B)
#   TTS: Piper voice (local, CPU) — no cloud calls anywhere

llm:
  provider: hermes            # primary brain: Hermes Agent API. "anthropic" = cloud fallback (not offline).
  model: local                # label only; the real model is configured inside Hermes
  api_key_env: ANTHROPIC_API_KEY
  max_tokens: 220
  temperature: 0.3
  history_turns: 12           # fallback provider only
  # --- split brain: fast conversation vs Hermes agent -----------------
  # Casual conversation goes to a small local chat model (OpenAI-compatible,
  # e.g. a second llama-server). Commands, live-data questions and URLs/paths
  # still go to Hermes. If the chat server is down, turns fall back to Hermes.
  router:
    enabled: true             # false = every turn goes to Hermes (old behaviour)
  chat:
    enabled: true             # true only works when base_url answers
    base_url: http://127.0.0.1:18084/v1
    model: local-chat         # label; llama-server uses the loaded GGUF
    max_tokens: 160
    temperature: 0.6
    history_turns: 8
    timeout: 30
    api_key_env: ""           # optional, e.g. MIA_CHAT_KEY
    system_prompt: >
      Govoriš kot Mia, slovenski glasovni pomočnik. Odgovarjaj v slovenščini,
      mirno in naravno. Prva poved naj ima največ 8 besed; skupaj 1–3 kratke
      povedi. Brez markdowna, seznamov in kodnih blokov. Če uporabnik zahteva
      dejanje na računalniku (odpri, zaženi, zapri, poišči, preberi, shrani,
      pošlji, nastavi, preveri ...), ne odgovarjaj sam: vrni točno [[AGENT]].





hermes:
  base_url: http://127.0.0.1:8642   # Hermes Agent API server (loopback)
  api_key_env: API_SERVER_KEY       # read from ~/.hermes/.env
  conversation: mia-main          # shared voice + HUD thread name
  session_key: mia:user:main      # stable long-term memory scope
  timeout: 240
  ack_after_seconds: 0               # >0 = speak a short ack while the agent works
  ack_texts: ["Takoj.", "Še delam.", "Skoraj."]
  fallback_provider: ""              # "" = offline: never fall back to a cloud LLM
  language_directive: "Odgovarjaj izključno v slovenščini, v kratkih govorjenih povedih."
  unreachable_text: "Hermesov gateway ni dosegljiv. Zaženi hermes gateway in poskusi znova."
  # ^ Prepended to every turn sent to Hermes. Hermes' own system prompt is the
  #   better place for persona rules; this line guarantees the reply language.

stt:
  model: large-v3-turbo      # multilingual. `small.en` cannot transcribe SL/SR at all.
  # Keep the GPU for your LLM. Whisper on CPU (int8) is slower but leaves every
  # MiB of VRAM to the model; with 35B Q4 there is no room to share.
  #   cpu              recommended when the LLM runs on this box
  #   cuda             fastest STT; start Hermes/the LLM *before* Mia
  #   auto             CUDA only if >= min_free_vram_gb is free at startup
  device: cpu
  min_free_vram_gb: 2.5      # only used by `auto`
  compute_type: int8         # int8 on CPU, float16 on CUDA
  sample_rate: 16000
  language: sl               # sl | sr | en | "" ("" = auto-detect, less accurate)
  # Whisper biases towards the prompt on noise/silence — never put the wake
  # word here, or every hiss becomes a hallucinated "Mia, ..." turn.
  initial_prompt: "odpri, zapri, pokliči, nastavi, preberi, pošlji, preveri."
  beam_size: 1
  # Neprestano poslušanje (gumb STALNO): VAD razdeli tok v izjave,
  # budnica »Mia« odpre pogovor, followup okno dovoli nadaljevanje brez nje.
  continuous:
    wake_words: ["mia", "mijo", "mija", "mio"]
    strict_wake: true        # vsaka izjava se MORA začeti z »Mia« — brez izjem
    followup_seconds: 0      # v strict načinu se ne uporablja; obdržano za
                             # združljivost (npr. 20 = follow-up brez budnice)
    silence_ms: 700          # toliko tišine zaključi izjavo
    min_speech_ms: 450       # krajše (kašelj, pok, šum) se ignorira
    threshold: 0.5           # prag za začetek izjave (višji = manj šuma)
    end_threshold: 0.25      # prag za konec (histereza; nižji = manj rezov)
    max_utterance_ms: 20000  # izjava se nikoli ne "izgubi": po 20 s se zaključi
    energy_override: true    # glasen zvok šteje kot govor, tudi če VAD reče ne
    min_rms: 700             # rezervni energijski prag (320 je lovil piskanje
                             # ventilatorja/TV; dvigni, če je v sobi stalni šum)
    barge_in: false          # false = pol-duplex (priporočeno: šum ne ubije turna;
                             # prekinitev z govorom med Mijinim govorjenjem)
    speaker_gate:            # glasovna kalibracija — Mia uboga samo vpisan glas
      enabled: true          # aktiven šele, ko obstaja profil:
                             # python3 server/scripts/calibrate_voice.py
      threshold: 0.30        # kosinusna podobnost odtisa; dvig = strožje
      require_profile: false # true = brez profila Mia ne obdeluje govora
      calibration:           # vodena kalibracija iz HUD-a (bližina/sredina/daleč)
        required: true       # HUD ob zagonu ponudi kalibracijo, če je ni
        stages:
          - {id: blizu,   label: "BLIZU mikrofona (0,5 m)",   seconds: 4, samples: 2}
          - {id: srednje, label: "SREDNJE (2–3 m)",           seconds: 4, samples: 2}
          - {id: dalec,   label: "DALEČ (5–6 m)",             seconds: 5, samples: 2}
      wake_override: true    # ob predvajanju medijev (mia-open okno živo) izrecna
                             # budnica prevzame turn — sicer glasbe ne moreš ustaviti
      probe_on_reject_seconds: 0   # 0 = zavrnjen glas se NE pošlje v STT (TV in
                             # šum ne zasedeta prepisa). >0 = vseeno prepiši
                             # zavrnjeno izjavo vsakih N s (npr. za vpis z
                             # »Mia, prepoznaj glas« iz drugega konca sobe).
      min_seconds: 1.0       # krajše izjave se ocenijo strožje (pod 0,4 s zavržene)
      profile: voices/speaker_profile.npz
  # Whisper na tišini/šumu "sliši" znane fraze (YouTube podnapisi ipd.) —
  # transkript, sestavljen samo iz njih, se zavrže:
  hallucination_filter:
    - "hvala što pratite"
    - "hvala za gledanje"
    - "hvala za ogled"
    - "thank you for watching"
    - "like and subscribe"
  partials: true             # live transcript while speaking
  partial_interval: 1.2      # seconds of new audio between partial passes
  # Optional GPU worker (worker/stt_server.py on any NVIDIA machine):
  # remote:
  #   name: gpu
  #   url: http://192.168.1.50:8768/stt
  #   token_env: MIA_HUD_TOKEN
  #   timeout: 6

tts:
  provider: piper            # piper | http | command | elevenlabs (cloud)
  piper:
    mode: cli                # cli = separate process (keeps GPL piper out of this codebase)
    binary: piper            # or /path/to/venv/bin/piper
    language: sl             # picks from `voices` below
    voices:
      sl: voices/sl_SI-artur-medium.onnx
      sr: voices/sr_RS-serbski_institut-medium.onnx
    length_scale: 1.0        # >1 slower, <1 faster (1.1–1.15 sounds calmer/gentler)
  # Local TTS *service*: model loads once, may run on another machine.
  # Start it with: scripts/gepard_tts.py --serve --port 8770 --engine gepard --fallback-piper
  #           or: scripts/gepard_tts.py --serve --port 8770 --engine maya1  --fallback-piper
  http:
    url: http://127.0.0.1:8770/tts
    format: wav              # wav | raw (raw needs sample_rate)
    timeout: 120
    name: gepard
    engine: gepard           # gepard | maya1 — what start-mia.sh launches
    # Extra arguments for the TTS service (passed to gepard_tts.py).
    # Female, gentle Slovenian voice with Maya1 (the adapter was trained on a
    # male speaker, so --pitch-semitones shifts pitch+formants into the female
    # range — needs ffmpeg):
    #   args: ["--maya-voice", "zenski-nezni", "--pitch-semitones", "4"]
    # or a free-form description:
    #   args: ["--maya-description", "A soft, gentle Slovenian female voice."]
    args: []
  # Any other local TTS, loaded per sentence: text on stdin, WAV/PCM on stdout.
  command:
    argv: ["python3", "scripts/gepard_tts.py", "--stdio", "--engine", "gepard"]
    format: wav
    sample_rate: 22050
  elevenlabs:                # cloud only; needs ELEVENLABS_API_KEY
    model: eleven_v3_conversational
    voice_id: YOUR_ELEVENLABS_VOICE_ID
    output_format: pcm_16000

machines: []                # optional extra machines for the HUD "Stroji" panel.

# Lokalni "možganski" sklad, ki ga start-mia.sh / stop-mia.sh zaženetā in
# ustavita skupaj z Mio (vsak korak se preskoči, če health URL že odgovarja).
# Brez te sekcije skripta predpostavi, da Hermes teče drugje.
# stack:
#   llama:                  # llama-server z lokalnim modelom za Hermesa
#     health: http://127.0.0.1:18081/health
#     start_timeout: 420    # velik GGUF se nalaga minute
#     pidfile: logs/llama-server.pid
#     log: logs/llama-server.out
#     supervisor: ""        # opcijski restart-on-crash ovoj; "" = brez
#     argv: [/pot/do/llama-server, -m, /pot/do/model.gguf, --port, "18081"]
#   chat:                   # mali model za tekoč pogovor (ločen od Hermesa)
#     health: http://127.0.0.1:18084/health
#     start_timeout: 420
#     pidfile: logs/chat-model.pid
#     log: logs/chat-model.out
#     argv: [/pot/do/llama-server, -m, /pot/do/chat-3b.gguf,
#            --port, "18084", --host, 127.0.0.1, -c, "2048"]


#   hermes:                 # Hermes gateway (API strežnik, na katerega se Mia veže)
#     health: http://127.0.0.1:8642/health
#     start_timeout: 90
#     unit: ""              # ime systemd --user enote, če obstaja (npr. hermes-gateway-XXXX)
#     pidfile: logs/hermes-gateway.pid
#     log: logs/hermes-gateway.out
#     argv: ["hermes", "gateway", "run"]
# Add entries only for boxes that actually run worker/worker_stats.py, otherwise
# the panel shows them as "brez povezave":
#   - name: "GPU WORKER"
#     host: 192.168.1.50
#     stats_url: http://192.168.1.50:8767/stats
#     ping_port: 445

usage:
  # Your LLM provider's pricing ($ per 1M tokens) for HUD cost estimates. 0 = token counts only.
  llm_cost_per_mtok_input: 0
  llm_cost_per_mtok_output: 0

server:
  host: 0.0.0.0              # wildcard bind (required for non-root port 443 on macOS)
  port: 8765                 # plain ws:// for the Python push-to-talk client
  tls_ports: [443, 8766]     # https/wss for the HUD (browser mic requires TLS)
  tls_cert: certs/cert.pem
  tls_key: certs/key.pem
  dashboard_proxy:           # TLS reverse proxy so the HUD can iframe the Hermes dashboard
    port: 9443
    target: http://127.0.0.1:9119

security:
  hud_token_env: MIA_HUD_TOKEN   # set in ~/.hermes/.env; unset = auth disabled
  extra_origin_hosts: []            # e.g. ["192.168.1.10"] if you open the HUD by raw IP

hud:
  allow_external_media: false   # YouTube/iframe panels need internet; false = fully offline

voice:                       # legacy block: only read when tts.provider is elevenlabs
  provider: elevenlabs
  model: eleven_flash_v2_5
  voice_name: "Your chosen voice"
  voice_id: YOUR_ELEVENLABS_VOICE_ID
  output_format: pcm_16000

persona:                     # used only by the anthropic fallback path
  system_prompt: >
    Govoriš kot Miin glasovni vmesnik. Odgovarjaj v slovenščini, mirno in kratko:
    ena do tri kratke povedi, brez markdowna, brez seznamov. Številke, datume in
    ure izgovarjaj z besedami. Nikoli ne izgovori skrivnosti, ključev ali gesel.

# ---------------------------------------------------------------- autonomy
# Samodejno prilagajanje, načrti, opravila in zdravje sistema.
autonomy:
  enabled: true
  interval_seconds: 30          # kako pogosto teče urnik v ozadju
  health_interval: 300          # zdravstveni pregled vsakih 5 minut
  max_jobs_per_tick: 3          # varovalka pred plazom opravil
  allow_destructive: false      # true = tudi nevarna dejanja brez potrditve
  auto_install: false           # true = samodejno namesti manjkajoča orodja
  auto_remediate: false         # true = samodejno popravi varna opozorila
  temp_max_age_hours: 48

# ---------------------------------------------------------------- learning
# Trajni spomin, navade, recepti in drevo veščin. Brez te sekcije veljajo
# privzete vrednosti (vklopljeno, baza v ~/.local/state/mia/learning.db).
learning:
  enabled: true
  db_path: "~/.local/state/mia/learning.db"
  audit_path: "~/.local/state/mia/control-audit.jsonl"
  skills_root: null                 # null = <repo>/skills
  auto_record: true                 # vsak sprejeti krog se zabeleži
  auto_feedback: true               # »to je bilo prav / ni prav«
  verify_prompts: true              # HUD kartica »JE BILO PRAVILNO?« ✓/✗
  auto_mine_interval_seconds: 900   # izkop navad + uvoz audita + indeks veščin
  context:
    enabled: true                   # [MIA SPOMIN …] pred vsakim krogom
    max_chars: 1500                 # stroga zgornja meja (tokeni so dragi)
    max_habits: 6
    max_recipes: 2
    max_mistakes: 3
    max_facts: 5
    include_skills: true
    include_system: true
  retention:
    episodes_days: 400
    events_days: 180
    max_episodes: 200000
    min_confidence: 0.12
  habits:
    min_evidence: 3                 # manj kot 3 ponovitve = ni navada
    recency_days: 120
    peak_share: 0.35                # 2-urno okno z >=35 % dogodkov = rutina
    sequence_window_minutes: 20
    decay_after_days: 45
  recipes:
    match_threshold: 0.52
    max_candidates: 3
    min_success: 1
    saturation: 3.0
  privacy:
    redact: true
    max_text_chars: 4000
    max_response_chars: 2000
